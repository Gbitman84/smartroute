<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4c1d95">
  <title>הרשמה – SmartRoute</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .reg-form { text-align: right; }
    .reg-form .field input[readonly] { background: var(--line); color: var(--muted); }
    .reg-form .hint { font-size: 12px; color: var(--muted); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <section class="login">
    <a class="btn small reg-link" href="./">כניסה ←</a>
    <div class="login-card">
      <div class="brand big">Smart<span>Route</span></div>
      <p>סידור מסלול משלוחים חכם</p>

      <form id="regForm" class="reg-form" novalidate>
        <h2 style="text-align:center;margin:8px 0 0">📝 הרשמה</h2>
        <p class="muted" style="text-align:center">השאר פרטים ונציג יחזור אליך עם קישור הצטרפות.</p>
        <label class="field">שם מלא
          <input id="regName" name="name" autocomplete="name" maxlength="60" required>
        </label>
        <label class="field">טלפון נייד
          <input id="regMobile" name="mobile" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="050-1234567" required>
        </label>
        <label class="field">קוד הפניה (Ref)
          <input id="regRef" name="ref" dir="ltr" maxlength="40" autocomplete="off" placeholder="לא חובה">
          <span id="regRefHint" class="hint">אם מישהו הפנה אותך – כתוב כאן את הקוד שלו.</span>
        </label>
        <label class="hp" aria-hidden="true">אל תמלא <input id="regWebsite" tabindex="-1" autocomplete="off"></label>
        <p id="regErr" class="err"></p>
        <button id="regSubmit" class="btn primary big" type="submit">שלח</button>
      </form>

      <div id="regDone" hidden>
        <p style="font-size:44px;margin:10px 0 0">✅</p>
        <h2>הפרטים נשלחו</h2>
        <p class="muted">תודה! נציג יחזור אליך בהקדם עם קישור להצטרפות.</p>
      </div>
    </div>
  </section>
  <script type="module" src="js/registration.js"></script>
</body>
</html>
